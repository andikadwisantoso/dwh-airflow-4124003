<!DOCTYPE html>
<html lang="id">
    <style>

        body{
            background: linear-gradient(135deg,#0f172a,#1e293b,#334155);
            min-height:100vh;
            color:white;
        }
        
        .glass-card{
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius:20px;
            border:1px solid rgba(255,255,255,0.2);
        }
        
        .table{
            color:white;
        }
        
        .table tbody tr:hover{
            background: rgba(255,255,255,0.1);
            transition:0.3s;
        }
        
        .btn-action{
            margin-right:5px;
        }
        
        .title-gradient{
            background: linear-gradient(to right,#38bdf8,#22c55e);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            font-weight:bold;
        }
        
        </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Wisatawan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="modal fade" id="editModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Edit Data Wisatawan</h5>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editId">

                <input type="text"
                       id="editNama"
                       class="form-control mb-2"
                       placeholder="Nama">

                <textarea id="editAlamat"
                          class="form-control mb-2"
                          placeholder="Alamat"></textarea>

                <input type="text"
                       id="editHp"
                       class="form-control mb-2"
                       placeholder="No HP">

                <input type="email"
                       id="editEmail"
                       class="form-control"
                       placeholder="Email">

            </div>

            <div class="modal-footer">
                <button class="btn btn-success"
                        onclick="updateData()">
                    Simpan
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4 title-gradient">
        Sistem Data Wisatawan
    </h1>
    
    <div class="card glass-card shadow-lg">

        <div class="card-body">
            <form id="wisatawanForm">
                <div class="mb-3">
                    <label class="form-label">Nama</label>
                    <input type="text" id="nama" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Alamat</label>
                    <textarea id="alamat" class="form-control" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">No HP</label>
                    <input type="text" id="no_hp" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control">
                </div>

                <button type="submit" class="btn btn-success">
                    Simpan Data
                </button>
            </form>
        </div>
    </div>

    <hr>

    <h4>Data Wisatawan</h4>
    <table class="table table-hover align-middle">
        <thead>
            <tr>
                <th>Nama</th>
                <th>Alamat</th>
                <th>No HP</th>
                <th>Email</th>
                <th width="180">Aksi</th>
            </tr>
        </thead>
    
        <tbody id="dataWisatawan"></tbody>
    </table>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-6v7vhu4EbOy64rO7hZx9X7DWlVl-W2s",
  authDomain: "basisdata-ae5f3.firebaseapp.com",
  projectId: "basisdata-ae5f3",
  storageBucket: "basisdata-ae5f3.firebasestorage.app",
  messagingSenderId: "734114747632",
  appId: "1:734114747632:web:0c6625e53f66ad60901e35"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("wisatawanForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const nama = document.getElementById("nama").value;
    const alamat = document.getElementById("alamat").value;
    const no_hp = document.getElementById("no_hp").value;
    const email = document.getElementById("email").value;

    try {
        await addDoc(collection(db, "wisatawan"), {
            nama,
            alamat,
            no_hp,
            email
        });

        alert("Data berhasil disimpan!");
        form.reset();
        tampilData();

    } catch (error) {
        console.error(error);
        alert("Gagal menyimpan data");
    }
});

async function tampilData() {

const tbody =
document.getElementById("dataWisatawan");

tbody.innerHTML = "";

const querySnapshot =
await getDocs(collection(db,"wisatawan"));

querySnapshot.forEach((d) => {

    const data = d.data();

    tbody.innerHTML += `
    <tr>
        <td>${data.nama}</td>
        <td>${data.alamat}</td>
        <td>${data.no_hp}</td>
        <td>${data.email}</td>

        <td>

            <button
                class="btn btn-warning btn-sm"
                onclick="editData(
                '${d.id}',
                '${data.nama}',
                '${data.alamat}',
                '${data.no_hp}',
                '${data.email}'
                )">

                Edit
            </button>

            <button
                class="btn btn-danger btn-sm"
                onclick="hapusData('${d.id}')">

                Hapus
            </button>

        </td>

    </tr>
    `;
});
}
window.editData = (
id,nama,alamat,no_hp,email
)=>{

document.getElementById("editId").value=id;
document.getElementById("editNama").value=nama;
document.getElementById("editAlamat").value=alamat;
document.getElementById("editHp").value=no_hp;
document.getElementById("editEmail").value=email;

const modal =
new bootstrap.Modal(
document.getElementById("editModal")
);

modal.show();

}
window.updateData = async ()=>{

const id =
document.getElementById("editId").value;

await updateDoc(
doc(db,"wisatawan",id),
{
    nama:
    document.getElementById("editNama").value,

    alamat:
    document.getElementById("editAlamat").value,

    no_hp:
    document.getElementById("editHp").value,

    email:
    document.getElementById("editEmail").value
}
);

alert("Data berhasil diupdate");

tampilData();

bootstrap.Modal.getInstance(
document.getElementById("editModal")
).hide();

}
window.hapusData = async(id)=>{

const konfirmasi =
confirm("Yakin ingin menghapus data?");

if(!konfirmasi) return;

await deleteDoc(
doc(db,"wisatawan",id)
);

alert("Data berhasil dihapus");

tampilData();

}

tampilData();

</script>

</body>
</html>
